<section class="give-section">
  <div class="container">
    <h1>Dízimos e Ofertas</h1>
    <p class="subtitle">"Cada um contribua segundo propôs no seu coração..." - 2 Coríntios 9:7</p>

    <div class="give-grid">
      <!-- Card PIX -->
      <div class="give-card highlighted">
        <span class="badge">Mais Prático</span>
        <h2>Contribuição via PIX</h2>
        <p>Utilize a chave CNPJ abaixo para realizar sua contribuição diretamente pelo app do seu banco:</p>

        <div class="pix-box">
          <code>{{ pixKey }}</code>
          <button class="btn btn-primary" (click)="copyPix()">
            {{ copied() ? 'Copiado!' : 'Copiar Chave' }}
          </button>
        </div>
      </div>
