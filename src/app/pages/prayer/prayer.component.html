<section class="prayer-section">
  <div class="container">
    <h2>Pedido de Oração</h2>
    <p class="subtitle">Conte conosco. Nossa equipe estará orando pela sua vida e família.</p>

    @if (submitted()) {
      <div class="success-card">
        <h3>Pedido Recebido!</h3>
        <p>Seu pedido de oração foi registrado. Que Deus abençoe sua vida.</p>
        <button class="btn btn-primary" (click)="resetForm()">Enviar outro pedido</button>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" #prayerForm="ngForm" class="prayer-form">
        <div class="form-group">
          <label for="name">Nome Completo *</label>
          <input type="text" id="name" name="name" [(ngModel)]="formData.name" required placeholder="Seu nome" />
        </div>

        <div class="form-group">
          <label for="email">E-mail (opcional)</label>
          <input type="email" id="email" name="email" [(ngModel)]="formData.email" placeholder="seu@email.com" />
        </div>

        <div class="form-group">
          <label for="message">Seu Pedido de Oração *</label>
          <textarea id="message" name="message" rows="5" [(ngModel)]="formData.message" required placeholder="Escreva seu motivo aqui..."></textarea>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="isPrivate" name="isPrivate" [(ngModel)]="formData.isPrivate" />
          <label for="isPrivate">Manter pedido confidencial (apenas para a liderança)</label>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!prayerForm.form.valid">Enviar Pedido</button>
      </form>
    }
  </div>
</section>
