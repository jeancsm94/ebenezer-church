<header class="header">
  <div class="header-container">
    <a routerLink="/" class="logo">
      <img [src]="themeService.theme() === 'dark' ? 'assets/logo-black.webp' : 'assets/logo-white.webp'" alt="Igreja Ebenézer" class="logo-img" />
      <span class="logo-text">
        <span class="logo-ebenezer">Ebenézer</span>
        <span class="logo-sub">Pedra de Ajuda</span>
      </span>
    </a>

    <button
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Fechar menu' : 'Abrir menu'"
      [attr.aria-expanded]="isMenuOpen()"
    >
      {{ isMenuOpen() ? '✕' : '☰' }}
    </button>

    <nav class="nav" [class.open]="isMenuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="isMenuOpen.set(false)">Início</a>
      <a routerLink="/sobre" routerLinkActive="active" (click)="isMenuOpen.set(false)">Sobre</a>
      <!-- <a routerLink="/ministerios" routerLinkActive="active" (click)="isMenuOpen.set(false)">Ministérios</a> -->
      <a routerLink="/eventos" routerLinkActive="active" (click)="isMenuOpen.set(false)">Eventos</a>
      <a routerLink="/contribuir" routerLinkActive="active" (click)="isMenuOpen.set(false)">Contribuir</a>

      <button
        type="button"
        class="theme-toggle"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro'"
      >
        @if (themeService.theme() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <!-- <a routerLink="/oracao" class="btn btn-primary" (click)="isMenuOpen.set(false)">Pedir Oração</a> -->
    </nav>
  </div>
</header>
